<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sensitive form - django-admin-errors demo</title>
</head>
<body>
    <h1>Sensitive form</h1>
    <p>Submitting raises an exception; the demo asserts the values below never reach storage.</p>
    <form method="post">
        {% csrf_token %}
        <label>Username <input type="text" name="username"></label><br>
        <label>Password <input type="password" name="password"></label><br>
        <label>Token <input type="text" name="token"></label><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
