[tox]
requires =
    tox>=4.11
    tox-uv>=1.11
runner = uv-venv-runner
env_list =
    py{310,311}-dj{42,52}-sqlite
    py312-dj{42,52,60,61}-sqlite
    py313-dj{52,60,61}-sqlite
    lint
    py313-dj{52,61}-postgres
    celery
    package

[testenv]
package = editable
dependency_groups = dev
set_env =
    DJANGO_SETTINGS_MODULE = tests.settings
commands = pytest {posargs:-q}

[testenv:py{310,311,312}-dj42-sqlite]
deps = Django>=4.2,<4.3

[testenv:py{310,311,312,313}-dj52-sqlite]
deps = Django>=5.2,<5.3

[testenv:py{312,313}-dj60-sqlite]
deps = Django>=6.0,<6.1

[testenv:py{312,313}-dj61-sqlite]
deps = Django>=6.1,<6.2

[testenv:py313-dj52-postgres]
deps = Django>=5.2,<5.3
dependency_groups = dev
extras = postgres
set_env =
    DJANGO_SETTINGS_MODULE = tests.settings
    DJANGO_DB = postgres
pass_env =
    ADMIN_ERRORS_TEST_PG_URL

[testenv:py313-dj61-postgres]
deps = Django>=6.1,<6.2
dependency_groups = dev
extras = postgres
set_env =
    DJANGO_SETTINGS_MODULE = tests.settings
    DJANGO_DB = postgres
pass_env =
    ADMIN_ERRORS_TEST_PG_URL

[testenv:lint]
dependency_groups = dev
commands =
    ruff check .
    ruff format --check .
    python -m django check --settings=tests.settings
    python -m django makemigrations admin_errors --check --dry-run --settings=tests.settings

[testenv:celery]
dependency_groups = dev
extras = celery
commands = pytest {posargs:-q}

[testenv:package]
package = skip
skip_install = true
deps =
    build
    twine
    uv
set_env =
    DJANGO_SETTINGS_MODULE = tests.package_settings
allowlist_externals =
    rm
    .tox/package-install/bin/python
commands =
    rm -rf dist .tox/package-install
    python -m build
    twine check dist/*
    uv venv .tox/package-install
    uv pip install --python .tox/package-install/bin/python --find-links dist django-admin-errors Django>=4.2
    .tox/package-install/bin/python -m django check --settings=tests.package_settings --pythonpath .
    .tox/package-install/bin/python -m django migrate --settings=tests.package_settings --pythonpath . --noinput
    .tox/package-install/bin/python -m tests.package_smoke
